# nginx: /etc/nginx/sites-available/home-manager
# Zamień zasoby.example.pl na swoją domenę. Certyfikat HTTPS doda certbot (patrz instrukcja).
server {
    listen 80;
    listen [::]:80;
    server_name zasoby.example.pl;

    # Dokumenty (PDF, zdjęcia paragonów) do 25 MB.
    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;   # z portem – potrzebne do ochrony przed CSRF
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
