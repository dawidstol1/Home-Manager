# Uruchomienie całości: docker compose up -d   →   http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: homemanager
      POSTGRES_USER: homemanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homemanager}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homemanager -d homemanager"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://homemanager:${POSTGRES_PASSWORD:-homemanager}@db:5432/homemanager
      PRODUCT_LOOKUP: ${PRODUCT_LOOKUP:-on}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - images:/data/images

volumes:
  pgdata:
  images:
